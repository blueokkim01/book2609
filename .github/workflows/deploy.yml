name: Deploy to Firebase

# main에 머지되면 Firebase Hosting(Flutter Web 빌드) + Firestore rules/indexes +
# Storage rules + Cloud Functions를 한 번에 배포한다.
#
# 필요한 저장소 시크릿(Settings > Secrets and variables > Actions):
#   FIREBASE_PROJECT_ID       실제 Firebase 프로젝트 ID
#   FIREBASE_SERVICE_ACCOUNT  Firebase 콘솔 > 프로젝트 설정 > 서비스 계정에서
#                             발급한 JSON 키 전체 내용(그대로 붙여넣기)
#
# 서비스 계정에는 Firebase Admin, Cloud Functions 배포, Firebase Hosting Admin
# 권한이 필요하다. 시크릿을 등록하기 전에는 이 워크플로가 실패한다.

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: npm install -g firebase-tools
      - run: |
          firebase deploy \
            --only hosting,firestore:rules,firestore:indexes,storage,functions \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive
